<div class="scanner-container relative">
  @if (isLoading()) {
    <div class="fixed inset-0 z- flex items-center justify-center bg-black/30">
      <div
        class="h-10 w-10 rounded-full border-4 border-white border-t-transparent animate-spin"
      ></div>
    </div>
  }

  <ngx-scanner-qrcode
    #scanner="scanner"
    class="scanner"
    [vibrate]="100"
    [isBeep]="true"
    [constraints]="cameraConstraints"
    (error)="onScannerError($event)"
  />

  <!-- Camera Selector Dropdown -->
  @if (scanner.devices | async; as devices) {
    <div class="camera-selector">
      <label for="camera-select">📷 Camera:</label>
      <select id="camera-select" [value]="selectedDeviceId()" (change)="onCameraChange($event)">
        <option *ngFor="let device of devices" [value]="device.deviceId">
          {{ device.label || 'Camera ' + (device.deviceId | slice: 0 : 5) }}
        </option>
      </select>
    </div>
  }

  <div class="scan-frame">
    <div class="scan-border"></div>
    <div class="scan-line"></div>
  </div>

  <div class="result">Result: {{ result() }}</div>

  <button class="cancel-btn" (click)="close()">
    {{ 'COMMON.CANCEL' }}
  </button>
</div>
