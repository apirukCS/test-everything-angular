<!-- qr-scan-dialog.html -->
<div class="scanner-container">
  <ngx-scanner-qrcode #scanner="scanner" (error)="onScanError($event)" (data)="onScanData($event)">
  </ngx-scanner-qrcode>

  <button (click)="start()">Start</button>
  <button (click)="stop()">Stop</button>

  <!-- Log Section -->
  <div class="log-container">
    <h3>📋 Event Log</h3>
    <div *ngFor="let log of logs" class="log-item" [ngClass]="log.type">
      <small>{{ log.time }}</small>
      <p>{{ log.message }}</p>
    </div>
  </div>

  <!-- Data Display -->
  <div class="data-display">
    <h3>📦 Scanned Data</h3>
    <pre>{{ scannerData | json }}</pre>
  </div>
</div>
