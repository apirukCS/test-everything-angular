<div class="scanner-container relative">
  @if (isLoading()) {
    <div class="fixed inset-0 z-[99] flex items-center justify-center bg-black/30">
      <div
        class="h-10 w-10 animate-spin rounded-full border-4 border-white border-t-transparent"
      ></div>
    </div>
  }

  <ngx-scanner-qrcode
    #scanner="scanner"
    class="scanner"
    [config]="cameraConfig"
    [vibrate]="100"
    [isBeep]="true"
  />

  @if (devices().length > 1) {
    <div class="absolute top-4 left-1/2 z-50 w-[90%] max-w-sm -translate-x-1/2">
      <select
        class="w-full rounded-lg border border-white/30 bg-black/60 px-3 py-2 text-sm text-white backdrop-blur focus:outline-none focus:ring-2 focus:ring-white/50"
        [value]="selectedDeviceId()"
        (change)="onCameraChange($event)"
      >
        @for (device of devices(); track device.deviceId) {
          <option class="bg-gray-900 text-white" [value]="device.deviceId">
            {{ device.label || 'Camera' }}
          </option>
        }
      </select>
    </div>
  }

  <div class="scan-frame">
    <div class="scan-border"></div>
    <div class="scan-line"></div>
  </div>

  <button class="cancel-btn" (click)="close()">
    {{ 'COMMON.CANCEL' }}
  </button>
</div>
